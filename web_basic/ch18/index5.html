<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // 구조분해 (비구조할당) - 배열
        const arr = [1,2,3,4,5];
        const num1 = arr[0];
        const num2 = arr[1];
        const num3 = arr[2];
        const num4 = arr[3];
        const num5 = arr[4];

        // 배열 구조분해 한 모양
        // 변수명 마음대로 지어도 됨 - 배열의 경우에 적용
        const [ n1, n2, n3, n4, n5 ] = arr;

        // const [ n1,  n3 ] = arr;


        function getData() {
            const student = {
                name: "김준일",
                age: 32,
            }
            const serverPort = 8080;
            const status = 200;

            // 배열에다가 여러 가지 자료 형태 넣을 수 있음
            return [ student, serverPort, status ];
        }

        const [ s, sp, st ] = getData();
        console.log(getData());

        console.log(s);
        console.log(sp);
        console.log(st);

        function useState(initvalue) {
            let v = initvalue;

            const setter = (value) => {
                v = value;
            }


            // getter
            const getter = () => {
                return v;
            }

            return [ v, setter, getter ];
        }

        const a = 10;

        // 리액트 상태관리
        const [ username, setUsername, getUsername] = useState("김준이"); // 초기값을 대입했다고 가정
        console.log(username);
        console.log(getUsername);
        setUsername("김준일");
        console.log(username);
        console.log(getUsername());

    </script>
</body>
</html>
