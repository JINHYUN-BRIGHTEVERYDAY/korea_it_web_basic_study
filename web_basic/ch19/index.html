<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<!-- 태그 하나가 자체 객체 -->

<body id="root">

    <h1>제목1</h1>
    <h1>제목2</h1>
    <div id="box1"></div>
    <div id="box2"></div>
    <div class="box3"></div>
    <div class="box3"></div>
    <div class="box3" style="width: 100px; height: 100px; background-color: yellow; "></div>
    <div id="box4" class="box44"></div>
    
    <div class="container">
        <div class="user-info">
            <div></div>
            <div></div>
        </div>
    </div>

    <script>
        // Dom : 문서를 객체화 하여 사용하기
        // DOM : Document Object Model
        const d = document;
        console.log(d);

        // body 객체 안에 많은 속성들
        const body = document.body;
        console.log(body);
        const bodyId = body.id;

        console.log(bodyId);
        // const h1 = body.h1;
        // console.log(h1); -> 되지 않음
        
        // h1 가져오기 -> 배열 안에 들어있음
        // 0번 인덱스에 들어있음 -> body 안에 여러 개의 요소가 있을 수 있음 
        const h1 = body.getElementsByTagName("h1");
        console.log(h1);

        console.log(h1[0].innerHTML);

        h1[0].innerHTML = "제목3"; // 기존의 제목을 제어할 수 있음


        // getElement에 복수 있는 것들은 전부 배열로 들고 와야 함
        const box1 = document.getElementById("box1");
        console.log(box1); // 객체 통째로 들고옴
        box1.innerText = "박스1";

        // getElement에 복수 있는 것들은 전부 배열로 들고 와야 함
        const box2 = document.getElementById("box2");
        console.log(box2); 
        // 객체 통째로 들고옴
        

        // 태그가 통째로 들어가기
        box2.innerHTML = `
        <ul>
            <li>html</li>
            <li>css</li> 
            <li>javascript</li>     
        </ul>
        `;

        const box3 = document.getElementsByClassName("box3");
        console.log(box3);

        // css 스타일 부여하기
        box3[0].style = `
            width: 100px;
            height: 100px;
            background-color: red; 
        `;

        box3[1].style = `
            width: 100px;
            height: 100px;
            background-color: blue; 
        `;

        // box3[2].style = `
        //     width: 100px;
        //     height: 100px;
        //     background-color: yellow; 
        // `;


        // css 요소를 선택자로 가져오겠다
        // 전부 다 들고 오지 않음 여러 개 중에서 가장 위의 하나만 가져옴 querySelector
        const box4 = document.querySelector("#box4");
        // const box44 = document.querySelector(".box44");
        // const divs = document.querySelector("div"); 

        // 전부 다 들고 오기 querySelectorAll
        const box44 = document.querySelectorAll(".box44");
        const divs = document.querySelectorAll("div"); 
        // div를 다 가져올 수도 있음
        // 선택자만 알고 있으면 다 쓸 수 있음

        // 어쨌든 선택해서 객체를 불러와야

        console.log(box4);
        console.log(box44);
        console.log(divs);

        // css 선택자 사용하여 해당 요소에 타고 들어가 접근하기
        const userDiv = document.querySelector(".container > .user-info > div::nth-of-type(2)");
        userDiv.innerText = "김준일";

        // 객체의 변수 -> 속성
        // 함수 -> 기능
    </script>

</body>
</html>
