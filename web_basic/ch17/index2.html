<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>

        /* promise (비동기처리) -> FIFO
        Promise  체이닝 (Chaining)으로 순서를 제어하는 방식으로
        이렇게 Promise를 반환하는 함수들을 .then() 메서드를 사용하여 순서대로 연결하는 것을 Promise 체이닝
        */

        const excutor = (resolve, reject) => {
            console.log(1);
            console.log(2);
            setTimeout(() => resolve(), 3000);
            // resolve();
        }

        new Promise(excutor).then(() => {
            console.log(6);
        });
        
        console.log(3);

        new Promise((resolve, reject) => {
            console.log(4);
            console.log(5);
            resolve();
        }).then(() => {
            console.log(7);
        });


        new Promise((resolve, reject) => {
            console.log("promise 생성");
            setTimeout(() => {
                const name = prompt("이름입력");
                if (!name) {
                    reject("오류!!!!");
                    return;
                }

                resolve(name);

            }, 5000);
            resolve();

        }).then((name) => {
            console.log(8);
            console.log(name);
        }).catch((error) => {
            console.log(error);
        });
    
    </script>
</body>
</html>
