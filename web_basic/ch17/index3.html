<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // 동기 -> 비동기
        console.log("a1");
        const p1 = new Promise((rs, rj) => { // promise 생성 
            console.log(1); // 생성되면 호출

            // resolve 호출 -> 바로 실행되지 않음
            // 대기열에 들어감
            rs(1 * 10);
        });

        // a1, 1

        console.log("a2");
        const p2 = new Promise((rs, rj) => {
            console.log(2);

            // resolve 호출 -> 바로 실행되지 않음
            // 대기열에 들어감
            rs(2 * 10);
        });

        // a2, 2


        console.log("a3");
        const p3 = new Promise((rs, rj) => {
            console.log(3);

            // resolve 호출 -> 바로 실행되지 않음
            // 대기열에 들어감
            rs(3 * 10);
        });

        // a3, 3

        console.log("a4");
        const p4 = p1.then((v) => {
            console.log(v);
            return v * 10;
        });


        console.log("a5");
        const p5 = p2.then((v) => {
            console.log(v);
            return v * 10;
        });


        console.log("a6");
        const p6 = p3.then((v) => {
            console.log(v);
            return v * 10;
        });



        console.log("a7");
        const p7 = p4.then((v) => {
            console.log(v);    
        })



        console.log("a8");
        const p8 = p5.then((v) => {
            console.log(v);    
        })



        console.log("a9");
        const p9 = p6.then((v) => {
            console.log(v);    
        })


        // 큐의 형태로

    </script>
</body>
</html>
